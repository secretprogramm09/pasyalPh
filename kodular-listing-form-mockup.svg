<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">PasyalPH mobile listing submission screen concept</title>
  <desc id="desc">A polished mobile screen for owners to submit a restaurant or Airbnb listing for admin review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff7f1"/><stop offset="1" stop-color="#e2f0e9"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17674d"/><stop offset="1" stop-color="#0d4938"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#123a2c" flood-opacity=".13"/></filter>
  </defs>
  <rect width="430" height="932" fill="url(#bg)"/>
  <rect width="430" height="258" rx="0" fill="url(#green)"/>
  <circle cx="390" cy="67" r="108" fill="#ffffff" opacity=".045"/><circle cx="24" cy="252" r="95" fill="#b2dbb5" opacity=".08"/>
  <text x="27" y="48" fill="#d9f2df" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">PASAYLPH  /  OWNER PORTAL</text>
  <text x="27" y="101" fill="#ffffff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Share your place</text>
  <text x="27" y="130" fill="#d8e9df" font-family="Arial,sans-serif" font-size="14">Add a local spot for travelers to discover.</text>
  <rect x="27" y="160" width="376" height="58" rx="16" fill="#ffffff" opacity=".12" stroke="#ffffff" stroke-opacity=".24"/>
  <circle cx="55" cy="189" r="15" fill="#d8f2df"/><path d="M49 190l5 5 9-11" fill="none" stroke="#17674d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="81" y="185" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">SUBMISSION REVIEW</text>
  <text x="81" y="202" fill="#d8e9df" font-family="Arial,sans-serif" font-size="11">Your listing is checked before it goes live.</text>
  <rect x="16" y="239" width="398" height="675" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="38" y="278" fill="#173d2f" font-family="Arial,sans-serif" font-size="18" font-weight="700">New listing</text>
  <text x="38" y="299" fill="#73877c" font-family="Arial,sans-serif" font-size="11">Tell us about your restaurant or stay.</text>
  <text x="38" y="328" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">LISTING TYPE</text>
  <rect x="38" y="339" width="171" height="42" rx="12" fill="#e5f3e9" stroke="#287757" stroke-width="1.5"/>
  <circle cx="58" cy="360" r="9" fill="#1b6a4e"/><circle cx="58" cy="360" r="3" fill="#fff"/>
  <text x="75" y="364" fill="#195c43" font-family="Arial,sans-serif" font-size="12" font-weight="700">Restaurant</text>
  <rect x="220" y="339" width="172" height="42" rx="12" fill="#ffffff" stroke="#dce7df"/>
  <text x="239" y="364" fill="#65786d" font-family="Arial,sans-serif" font-size="12">Airbnb stay</text>
  <text x="38" y="408" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">BUSINESS / PROPERTY NAME</text>
  <rect x="38" y="418" width="354" height="43" rx="11" fill="#fff" stroke="#dce7df"/>
  <text x="52" y="445" fill="#9aa9a0" font-family="Arial,sans-serif" font-size="12">e.g. Isla Verde Kitchen</text>
  <text x="38" y="487" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">DESCRIPTION</text>
  <rect x="38" y="497" width="354" height="58" rx="11" fill="#fff" stroke="#dce7df"/>
  <text x="52" y="522" fill="#9aa9a0" font-family="Arial,sans-serif" font-size="12">What should visitors know?</text>
  <text x="38" y="581" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">ADDRESS IN THE PHILIPPINES</text>
  <rect x="38" y="591" width="354" height="43" rx="11" fill="#fff" stroke="#dce7df"/>
  <text x="52" y="618" fill="#9aa9a0" font-family="Arial,sans-serif" font-size="12">Street, barangay, city, province</text>
  <rect x="38" y="643" width="354" height="36" rx="10" fill="#f2f8f4"/>
  <path d="M55 654c-5 0-8 4-8 8 0 6 8 12 8 12s8-6 8-12c0-4-3-8-8-8zm0 5a3 3 0 110 6 3 3 0 010-6z" fill="#267452"/>
  <text x="72" y="666" fill="#347052" font-family="Arial,sans-serif" font-size="10" font-weight="700">Choose the exact pin on map</text>
  <text x="38" y="704" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">CONTACT NUMBER</text>
  <rect x="38" y="714" width="354" height="43" rx="11" fill="#fff" stroke="#dce7df"/>
  <text x="52" y="741" fill="#9aa9a0" font-family="Arial,sans-serif" font-size="12">+63 9XX XXX XXXX</text>
  <text x="38" y="783" fill="#385346" font-family="Arial,sans-serif" font-size="11" font-weight="700">COVER PHOTO</text>
  <rect x="38" y="793" width="354" height="53" rx="12" fill="#f8fbf9" stroke="#bfd7c8" stroke-dasharray="5 4"/>
  <circle cx="67" cy="819" r="14" fill="#e4f2e8"/><path d="M61 822l5-6 4 4 3-3 5 6H61zm5-8a2 2 0 110 4 2 2 0 010-4z" fill="#287757"/>
  <text x="91" y="816" fill="#315544" font-family="Arial,sans-serif" font-size="11" font-weight="700">Add a listing photo</text>
  <text x="91" y="831" fill="#8a9a90" font-family="Arial,sans-serif" font-size="10">JPG or PNG · optional</text>
  <rect x="38" y="860" width="354" height="42" rx="13" fill="url(#green)"/>
  <text x="215" y="886" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Submit for review  →</text>
  <text x="215" y="926" text-anchor="middle" fill="#6c8075" font-family="Arial,sans-serif" font-size="10">Designed for Kodular · mobile listing submission concept</text>
</svg>
